name: AWS Lambda

# main への push では自動デプロイしません。手動実行のみです。
on:
  workflow_dispatch:

jobs:
  deploy:

    runs-on: ubuntu-latest

    environment:
      name: aws-lambda

    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: configure-aws-credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ secrets.AWS_REGION }}
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: GitHubActions

    - name: get-caller-identity is allowed to run on role.
      run: aws sts get-caller-identity

    - name: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Create deploy_package
      run: |
        cd backend/
        python -m pip install -r ./requirements.txt --target .
        zip deploy_package.zip . -r -x requirements.txt requirements-dev.txt pyproject.toml Dockerfile .dockerignore .gitignore local_test.py 'tests/*' '*__pycache__*' '.pytest_cache/*' '.ruff_cache/*'

    - name: Print deploy_package.zip file size
      run: |
        cd backend/
        ls -lh | grep deploy_package.zip

    - name: lambda update
      run: |
        cd backend/
        aws lambda update-function-code \
          --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
          --zip-file fileb://deploy_package.zip \
          --publish
