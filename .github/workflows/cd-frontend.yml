# 参考: https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-vue-and-nuxt
name: GitHub Pages

# main への push では自動デプロイしません。手動実行のみです。
on:
  workflow_dispatch:

jobs:
  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # package-lock.json と package.json が食い違う場合に落ちます。
    - run: |
        cd frontend
        npm ci
        VUE_APP_BACKEND_BASE_URL=${{ secrets.VUE_APP_BACKEND_BASE_URL }} npm run build

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      if: ${{ github.ref == 'refs/heads/main' }}
      with:
        # Note that the GITHUB_TOKEN is NOT a personal access token.
        # A GitHub Actions runner automatically creates a GITHUB_TOKEN secret to authenticate in your workflow.
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend/dist
